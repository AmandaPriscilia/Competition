<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lapor Insiden - PANCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="../assets/logo-tab.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="font-sans text-gray-800 antialiased flex flex-col min-h-screen pt-[90px]">
    <header class="w-full bg-[var(--bg-header)] flex justify-between items-center px-5 lg:px-16 py-5 shadow-sm fixed top-0 left-0 bg-white/5 backdrop-blur-xl border-b border-white/10 transition-colors duration-300 z-50">
      <div class="logo">
        <div class="h-12 w-12 rounded-full overflow-hidden flex items-center justify-center">
          <img src="../assets/logo.png" alt="Pangan Ceria Logo" class="h-full w-full object-contain hover:scale-110 transition-transform duration-300 cursor-pointer" />
        </div>
      </div>
      <button class="menu-toggle lg:hidden text-gray-800 text-2xl focus:outline-none hover:text-[var(--primary)] transition duration-300 transform active:scale-90">
        <i class="fas fa-bars"></i>
      </button>
      <nav class="nav-menu">
        <ul class="flex flex-col lg:flex-row items-center space-y-6 lg:space-y-0 lg:space-x-10">
          <li>
            <a href="../index.html" class="relative text-gray-600 font-medium text-sm transition-colors duration-300 hover:text-[var(--dark)] group">
              Home
              <span class="absolute left-1/2 bottom-[-4px] w-0 h-[3px] bg-[var(--primary)] transition-all duration-300 ease-out transform -translate-x-1/2 group-hover:w-full rounded-full"></span>
            </a>
          </li>
          <li>
            <a href="./about.html" class="relative text-gray-600 font-medium text-sm transition-colors duration-300 hover:text-[var(--dark)] group">
              About us
              <span class="absolute left-1/2 bottom-[-4px] w-0 h-[3px] bg-[var(--primary)] transition-all duration-300 ease-out transform -translate-x-1/2 group-hover:w-full rounded-full"></span>
            </a>
          </li>
          <li>
            <a href="./dashboard.html" class="relative text-gray-600 font-medium text-sm transition-colors duration-300 hover:text-[var(--dark)] group">
              Dashboard
              <span class="absolute left-1/2 bottom-[-4px] w-0 h-[3px] bg-[var(--primary)] transition-all duration-300 ease-out transform -translate-x-1/2 group-hover:w-full rounded-full"></span>
            </a>
          </li>
          <li>
            <a href="./edukasi.html" class="relative text-gray-600 font-medium text-sm transition-colors duration-300 hover:text-[var(--dark)] group">
              Edukasi
              <span class="absolute left-1/2 bottom-[-4px] w-0 h-[3px] bg-[var(--primary)] transition-all duration-300 ease-out transform -translate-x-1/2 group-hover:w-full rounded-full"></span>
            </a>
          </li>
          <li>
            <a href="./audit.html" class="relative text-gray-600 font-medium text-sm transition-colors duration-300 hover:text-[var(--dark)] group">
              Audit
              <span class="absolute left-1/2 bottom-[-4px] w-0 h-[3px] bg-[var(--primary)] transition-all duration-300 ease-out transform -translate-x-1/2 group-hover:w-full rounded-full"></span>
            </a>
          </li>
          <li class="lg:hidden w-full">
            <a href="./laporan.html" class="block w-full">
              <button class="bg-[var(--dark)] text-white font-bold w-full py-2.5 rounded-md text-sm shadow-lg">Lapor</button>
            </a>
          </li>
        </ul>
      </nav>
      <div class="hidden lg:block">
        <a href="./laporan.html" class="inline-block">
          <button class="bg-[var(--dark)] text-white font-bold px-8 py-2.5 rounded-md text-sm shadow-lg transition-all duration-300 hover:bg-black hover:-translate-y-1 hover:shadow-2xl active:translate-y-0">Lapor</button>
        </a>
      </div>
    </header>

    <main class="flex-grow">
      <section class="laporan-hero relative w-full h-[400px] overflow-hidden flex items-center justify-center text-center px-4">
        <div class="absolute inset-0 bg-black/65 z-0"></div>
        <h1 class="relative z-10 text-white text-3xl md:text-4xl font-bold leading-tight drop-shadow-lg">Lapor Cepat Insiden<br />Keamanan Pangan</h1>
      </section>

      <section class="max-w-6xl mx-auto px-5 lg:px-0 py-12 bg-white md:bg-transparent -mt-10 md:mt-0 relative z-20 md:z-auto rounded-t-3xl md:rounded-none">
        <div class="bg-white p-6 md:p-12 rounded-lg shadow-lg">
          <h2 class="text-2xl md:text-3xl font-bold text-[var(--dark)] mb-2">Pelaporan Insiden</h2>
          <p class="text-sm md:text-base text-gray-500 mb-8">
            Laporkan dugaan masalah keamanan pangan pada program makanan bergizi gratis.<br class="hidden md:block" />
            Kerahasiaan pelapor dijamin.
          </p>

          <form id="reportForm" action="#" class="space-y-6">
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Jenis Laporan</label>
              <div class="relative">
                <select class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-700 focus:outline-none focus:ring-1 focus:ring-[var(--primary)] appearance-none bg-white" required>
                  <option value="">-- Pilih Jenis Laporan --</option>
                  <option>Makanan Kedaluwarsa</option>
                  <option>Distribusi Tidak Sesuai Prosedur</option>
                  <option>Dugaan Kontaminasi</option>
                  <option>Lainnya</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                  <i class="fas fa-chevron-down text-xs"></i>
                </div>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Lokasi/Sekolah Kejadian</label>
              <div class="relative">
                <input
                  type="text"
                  placeholder="Cth: SMA NEGERI 2 AMBON atau Jl. Kenanga No. 5"
                  class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-700 focus:outline-none focus:ring-1 focus:ring-[var(--primary)]"
                  id="locationInput"
                  required
                />
                <div class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                  <i class="fas fa-map-marker-alt"></i>
                </div>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Tanggal Kejadian</label>
              <div class="relative">
                <input type="date" class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-700 focus:outline-none focus:ring-1 focus:ring-[var(--primary)] uppercase" required />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Deskripsikan Temuan</label>
              <textarea
                rows="3"
                placeholder="Jelaskan secara detail terkait dugaan keamanan pada program makanan bergizi gratis"
                class="w-full border border-gray-300 rounded-md px-4 py-3 text-gray-700 focus:outline-none focus:ring-1 focus:ring-[var(--primary)] resize-none"
                required
              ></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">Upload Bukti</label>
              <input type="file" class="input-file-custom w-full border border-gray-300 rounded-md px-2 py-2 text-sm text-gray-500 focus:outline-none focus:ring-1 focus:ring-[var(--primary)] bg-white" required />
            </div>
            <button type="submit" class="btn-laporan-submit w-full text-white font-bold py-3 rounded-md shadow-md transition-all duration-300 mt-4" id="submitReportButton">Kirim Laporan</button>
          </form>
        </div>
      </section>

      <section class="bg-[#F8F9FA] py-12 px-5 lg:px-16">
        <div class="max-w-7xl mx-auto">
          <h2 class="text-2xl md:text-3xl font-bold text-[var(--dark)] mb-10">Daftar Laporan yang Diterima</h2>

          <div id="reportListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
        </div>
      </section>
    </main>

    <footer class="bg-[var(--dark-grey)] text-gray-300 py-8 px-5 lg:px-16 mt-auto border-t border-gray-600/30">
      <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-3 items-center">
        <div class="flex justify-center sm:justify-start mb-4 sm:mb-0">
          <div class="h-12 w-12 rounded-full overflow-hidden bg-white shadow-md flex items-center justify-center">
            <img src="../assets/logo.png" alt="Logo Footer" class="h-full w-full object-contain" />
          </div>
        </div>
        <div class="text-center text-sm tracking-wide mb-4 sm:mb-0">© 2025 PanganCeria. All Rights Reserved.</div>
        <div class="flex justify-center sm:justify-end space-x-5 text-white text-xl">
          <a href="https://www.instagram.com/" class="hover:text-[var(--primary)] transition-colors" target="_blank">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="https://github.com/Pangan-Ceria" class="hover:text-[var(--primary)] transition-colors" target="_blank">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/" class="hover:text-[var(--primary)] transition-colors" target="_blank">
            <i class="fab fa-linkedin"></i>
          </a>
        </div>
      </div>
    </footer>

    <script src="../js/script.js"></script>
  </body>
</html>
